<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="228" height="1288" viewBox="0 0 57 322">
  <title>Siemens AI 8xI 2-/4-wire BA, 6ES7134-6GF00-0AA1</title>
  <desc>Vector reconstruction of the supplied front-view module and terminal base. Original silhouette, status indicators, face labeling and circular terminal positions are retained. Channel callout arrows belong to the editor and are excluded from this hardware asset.</desc>
